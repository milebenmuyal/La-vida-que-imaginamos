  <!-- SCRIPTS DEL PROYECTO -->
  <script>
    /* 1. SCRIPT DE MUSICA DE FONDO */
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');

    const imgPlay = 'img/nombre_del_archivo_del_boton_de_musica.jpg';
    const imgPause = 'img/nombre_del_archivo_del_boton_de_musica.jpg'; 

    function toggleMusic() {
      if (music.paused) {
        music.play().then(() => {
          btn.src = imgPause;
          btn.classList.add('playing');
        }).catch(error => {
          console.log("Error al reproducir audio:", error);
        });
      } else {
        music.pause();
        btn.src = imgPlay;
        btn.classList.remove('playing');
      }
    }

    /* 2. SCRIPT AUTO-REPRODUCCION DE VIDEO AL HACER SCROLL */
    const video = document.getElementById('webtoonVideo');

    // Configuracion del detector de visibilidad
    const observerOptions = {
      root: null,
      threshold: 0.5 // Se activa cuando al menos el 50% del video entra en pantalla
    };

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          // El video es visible: reproducir
          video.play().catch(err => console.log("Autoplay bloqueado:", err));
        } else {
          // El video salió de la pantalla: pausar para ahorrar recursos
          video.pause();
        }
      });
    }, observerOptions);

    if (video) {
      videoObserver.observe(video);
    }
  </script>
